name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline=false

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: |
          npm test 2>&1 | tee test_output.log
          exit ${PIPESTATUS[0]}

      - name: Build ai
        run: |
          echo "=== Building ai ==="
          npm run build --workspace=packages/ai 2>&1; echo "ai exit: $?"

      - name: Build core
        run: |
          echo "=== Building core ==="
          npm run build --workspace=packages/core 2>&1; echo "core exit: $?"

      - name: Build exporter
        run: |
          echo "=== Building exporter ==="
          npm run build --workspace=packages/exporter 2>&1; echo "exporter exit: $?"

      - name: Build runtime
        run: |
          echo "=== Building runtime ==="
          npm run build --workspace=packages/runtime 2>&1; echo "runtime exit: $?"

      - name: Build editor
        run: |
          echo "=== Building editor ==="
          npm run build --workspace=packages/editor 2>&1; echo "editor exit: $?"

      - name: Build full workspace
        run: |
          echo "=== Full workspace build ==="
          npm run build --workspaces 2>&1; echo "workspace exit: $?"
