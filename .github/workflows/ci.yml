name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-typecheck:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages individually
        run: |
          echo "=== Building ai ==="
          npm run build --workspace=packages/ai 2>&1; echo "ai exit: $?"
          echo "=== Building core ==="
          npm run build --workspace=packages/core 2>&1; echo "core exit: $?"
          echo "=== Building exporter ==="
          npm run build --workspace=packages/exporter 2>&1; echo "exporter exit: $?"
          echo "=== Building runtime ==="
          npm run build --workspace=packages/runtime 2>&1; echo "runtime exit: $?"
          echo "=== Building editor ==="
          npm run build --workspace=packages/editor 2>&1; echo "editor exit: $?"
