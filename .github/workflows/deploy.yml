name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Editor to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline=false

      - name: Build core
        run: npm run build --workspace=packages/core

      - name: Build ai
        run: npm run build --workspace=packages/ai

      - name: Build exporter
        run: npm run build --workspace=packages/exporter

      - name: Build runtime
        run: npm run build --workspace=packages/runtime

      - name: Build editor
        run: npm run build --workspace=packages/editor

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'packages/editor/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment on commit
        if: github.event.head_commit.message
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            --field body="🚀 Deploy completed via GitHub Pages

Commit: ${{ github.sha }}
Message: ${COMMIT_MSG}
Author: ${{ github.actor }}
URL: ${PAGE_URL}"
